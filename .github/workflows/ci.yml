name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded pull request runs. Never on main, a merge should end with a finished result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # --locked-mode: fail if the lock files are stale instead of rewriting them on the runner.
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Vulnerability report
        run: dotnet package list --vulnerable --include-transitive

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Tests that need Docker run in the Linux job below.
      - name: Test
        run: dotnet test --no-build --configuration Release --filter-not-trait "Requires=Docker"

  database-tests:
    name: Database tests
    # GitHub's Windows runners cannot run Linux containers, and the postgres image is one.
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore tests/Mosaic.Api.Tests/Mosaic.Api.Tests.csproj --locked-mode

      # A run that matches no test fails, so a trait spelled differently here turns this job red.
      - name: Test
        run: dotnet test --project tests/Mosaic.Api.Tests/Mosaic.Api.Tests.csproj --no-restore --configuration Release --filter-trait "Requires=Docker"
