name: mosaic-dev

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: mosaic
      POSTGRES_USER: mosaic
      # Not a secret. This database holds nothing real and is reachable only from this machine.
      POSTGRES_PASSWORD: mosaic-dev-only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic -d mosaic"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
